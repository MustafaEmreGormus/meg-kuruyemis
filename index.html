<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEG KURUYEMİŞ</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js"></script>
<header>
    <img src="images/logo.jpg" alt="MEG Logo">
    <h1>MEG KURUYEMİŞ</h1>
    <div style="text-align: right; padding-right: 20px;" id="kullanici-alani">
        <button onclick="panelAc('giris')" style="background:none; border:none; cursor:pointer; font-size:1.1em;">👤 Giriş Yap</button> | 
        <button onclick="panelAc('kayit')" style="background:none; border:none; cursor:pointer; font-size:1.1em;">📝 Kayıt Ol</button>
    </div>
</header>

<div id="yanPanel" class="yan-panel">
    <div style="text-align: right; padding: 10px;"><button onclick="panelKapat()" style="border:none; background:none; font-size:20px; cursor:pointer;">&times;</button></div>
    <div class="panel-icerik" id="panelIcerik"></div>
</div>

<div class="container">
    <div style="text-align:center;">
        <button class="filtre-btn" onclick="filtrele('hepsi')">Hepsi</button>
        <button class="filtre-btn" onclick="filtrele('kuruyemis')">Kuruyemiş</button>
        <button class="filtre-btn" onclick="filtrele('sekerleme')">Şekerleme</button>
        <br><br>
        <input type="text" class="ai-arama" placeholder="AI ile ürün ara..." >
        <button class="akilliara" onclick="aiAra()">🔍 Akıllı Ara</button>
    </div>

    <div class="urun-listesi" id="urun-kutusu">
        <p style="text-align:center; color:white;">Veritabanına bağlanılıyor...</p>
    </div>

    <div class="ai-danisman">
        <h3>🤖 MEG AI DANIŞMAN</h3>
        <p id="ai-cevap">Merhaba! Sana yardımcı olabilirim.</p>
        <input type="text" id="ai-soru" placeholder="AI'ye sor..." style="width:70%; padding:10px;">
        <button onclick="aiDanis()" class="akilliara">Sor</button>
    </div>

    <div class="sepet-ozeti">
        <h3>🛒 Sepetiniz</h3>
        <ul id="sepet-listesi"><li>Sepetiniz boş.</li></ul>
        
        <div id="adres-alani" style="margin-top: 15px; display: none;">
            <label for="musteri-adres" style="font-weight: bold; display: block; margin-bottom: 5px;">Teslimat Adresi:</label>
            <textarea id="musteri-adres" placeholder="Lütfen açık adresinizi buraya yazınız..." 
                style="width: 100%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid gray; box-sizing: border-box; font-family: inherit;"></textarea>
        </div>

        <h3 style="margin-top: 20px;">Toplam: <span id="toplam-fiyat">0</span> TL</h3>
        <button onclick="stokGuncelleVeGonder()" class="siponayla">
            Siparişi Onayla & WhatsApp'a Geç
        </button>
    </div>
</div>

<footer>
    <h2>BİZ KİMİZ?</h2>
    <p>© 2026 MEG Kuruyemiş - Tüm Hakları Saklıdır.</p>
</footer>
</body>
</html>
